{% extends 'base.html' %}
{% block title %}Scan Barcode{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">Barcode Lookup</h4>
            </div>
            <div class="card-body">
                <p class="text-muted">Scan or type a barcode below.</p>
                <div class="mb-3">
                    <input type="text" id="barcodeInput" class="form-control form-control-lg"
                           placeholder="Scan barcode here..." autofocus autocomplete="off">
                </div>
                <div id="result" class="mt-3" style="display:none;"></div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>
const input = document.getElementById('barcodeInput');
const result = document.getElementById('result');

input.addEventListener('keydown', async (e) => {
    if (e.key !== 'Enter') return;
    const barcode = input.value.trim();
    if (!barcode) return;

    result.innerHTML = '<div class="spinner-border text-primary" role="status"></div>';
    result.style.display = 'block';

    try {
        const resp = await fetch('/products/scan', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({barcode})
        });
        const data = await resp.json();

        if (resp.ok) {
            const priceDisplay = data.current_price != null ? `$${data.current_price.toFixed(2)}` : 'Not set';
            result.innerHTML = `
                <div class="card border-success">
                    <div class="card-body">
                        <h5>${data.name}</h5>
                        <p class="text-muted mb-1">${data.brand || ''}</p>
                        <p class="fs-4 fw-bold text-success">${priceDisplay}</p>
                        {% if current_user.is_owner %}
                        <a href="/prices/edit/${data.id}" class="btn btn-warning">Edit Price</a>
                        {% endif %}
                    </div>
                </div>`;
        } else {
            let html = `<div class="alert alert-danger">${data.error || 'Product not found'}</div>`;
            if (data.can_create && data.barcode) {
                html += `<a href="/products/create?barcode=${encodeURIComponent(data.barcode)}" class="btn btn-secondary">Add Manually</a>`;
            }
            result.innerHTML = html;
        }
    } catch {
        result.innerHTML = '<div class="alert alert-danger">Connection error</div>';
    }
    input.value = '';
    input.focus();
});
</script>
{% endblock %}
